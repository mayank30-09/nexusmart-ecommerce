{% extends "base.html" %}

{% block title %}Edit Delivery Address - NexusMart{% endblock %}

{% block content %}
<div class="edit-address-container" style="max-width: 640px; margin: 0 auto;">
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
        <a href="{{ url_for('profile') }}" class="back-link" id="link-back-profile">&larr; Back to Profile & Addresses</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Edit Address #{{ address['id'] }}</span>
    </nav>

    <div class="profile-card" id="edit-address-card">
        <h2>Edit Delivery Address</h2>
        <p class="text-muted" style="margin-bottom: 1.25rem; font-size: 0.88rem;">
            Update your shipping address information below.
        </p>

        <form method="POST" action="{{ url_for('edit_address', address_id=address['id']) }}" id="edit-address-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="address_line">Street Address / House / Flat *</label>
                <input 
                    type="text" 
                    id="address_line" 
                    name="address_line" 
                    class="form-control" 
                    value="{{ address['address_line'] }}" 
                    required
                >
            </div>

            <div class="address-fields-grid">
                <div class="form-group">
                    <label for="city">City *</label>
                    <input 
                        type="text" 
                        id="city" 
                        name="city" 
                        class="form-control" 
                        value="{{ address['city'] }}" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="state">State *</label>
                    <input 
                        type="text" 
                        id="state" 
                        name="state" 
                        class="form-control" 
                        value="{{ address['state'] }}" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="postal_code">Postal Code *</label>
                    <input 
                        type="text" 
                        id="postal_code" 
                        name="postal_code" 
                        class="form-control" 
                        value="{{ address['postal_code'] }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-checkbox-group" style="margin: 1rem 0;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input 
                        type="checkbox" 
                        name="is_default" 
                        id="is_default" 
                        value="1" 
                        {% if address['is_default'] %}checked{% endif %}
                    >
                    <span>Set as default delivery address</span>
                </label>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" id="btn-save-edit-address">
                    Save Changes
                </button>
                <a href="{{ url_for('profile') }}" class="btn btn-outline" id="btn-cancel-edit-address">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
